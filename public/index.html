<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peixAIrada</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e5e5e0; --accent: #c96442;
    --working: #d9a82a; --idle: #2f9e5b; --needs: #d64545; --ended: #a3a39e; --unread: #c96442;
    --user-bg: #f0efe9; --tool-bg: #f7f7f4; --code-bg: #efeee8; --code-line: #dedcd2;
    --code-ink: #a8442a; --inline-bg: rgba(0, 0, 0, .055);
    --you: #2f8b7c; --snip-claude: #45443f; --vscode: #0066b8;
    --pr-open: #2f9e5b; --pr-merged: #8250df; --pr-closed: #d64545; --pr-draft: #8b8b85;
    --term-bg: #f4f3ee; --term-sel: rgba(0, 0, 0, .14);
    /* Syntax colours, one set per theme — the whole highlight.js palette hangs off these eight. */
    --hl-com: #97968d; --hl-key: #9c27a0; --hl-str: #4a8c3f; --hl-num: #98651a;
    --hl-fn: #2f6fd0; --hl-cls: #a8791a; --hl-var: #cf4b3c; --hl-meta: #6b7f9e;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1c1c1a; --ink: #e8e6df; --muted: #9a998f; --line: #2c2c29; --accent: #e08a68;
    --user-bg: #23231f; --tool-bg: #1f1f1c; --code-bg: #101010; --code-line: #2e2e2a; --ended: #5d5d58;
    --code-ink: #e0a284; --inline-bg: rgba(255, 255, 255, .075);
    --you: #4fb8a8; --snip-claude: #c9c7bd; --vscode: #4aa5f0;
    --pr-open: #3fb950; --pr-merged: #a371f7; --pr-closed: #f85149; --pr-draft: #8b8b85;
    --term-bg: #111110; --term-sel: rgba(255, 255, 255, .22);
    --hl-com: #7c7c74; --hl-key: #c678dd; --hl-str: #98c379; --hl-num: #d19a66;
    --hl-fn: #61afef; --hl-cls: #e5c07b; --hl-var: #e06c75; --hl-meta: #8fa6c4;
  } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
  header h1 em { font-style: normal; color: var(--accent); }
  header .spacer { flex: 1; }
  header .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  header button, .btn { font: inherit; font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; cursor: pointer; white-space: nowrap; }
  header button:hover, .btn:hover { border-color: var(--accent); }
  .btn.icon { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; color: var(--muted); }
  .btn.icon .ic { width: 15px; height: 15px; vertical-align: 0; fill: currentColor; }
  .btn.icon:hover { color: var(--ink); }
  .btn.icon:disabled { opacity: .45; cursor: default; border-color: var(--line); }
  #focusBtn .ic { fill: var(--vscode); }
  .btn.icon.err { color: var(--needs); border-color: var(--needs); }
  #focusBtn.err .ic { fill: var(--needs); }   /* must out-specify #focusBtn .ic above */
  #termBtn.on { color: var(--accent); border-color: var(--accent); }
  .btn.icon .lbl { font-size: 11px; }
  header label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  header select, .colhead select { font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; max-width: 180px; }
  header input[type=text] { font: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; width: 190px; }
  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--ended); flex: none; }
  #conn.on { background: var(--idle); }
  #counts { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ---- layout: projects | sessions | splitter | chat ---- */
  main { display: flex; min-height: 0; min-width: 0; }
  #projects { width: 250px; flex: none; display: grid; grid-template-rows: auto 1fr; border-right: 1px solid var(--line); min-height: 0; background: var(--panel); }
  #sessions { width: 380px; min-width: 260px; max-width: 60vw; flex: none; display: grid; grid-template-rows: auto auto 1fr; min-height: 0; min-width: 0; }
  #splitter { width: 6px; flex: none; cursor: col-resize; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--panel); }
  #splitter:hover, #splitter.drag { background: var(--accent); }
  #chat { flex: 1; min-width: 320px; display: grid; grid-template-rows: auto 1fr auto auto; min-height: 0; }
  .colhead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 700; min-width: 0; min-height: 43px; }
  .colhead .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); font-weight: 800; display: flex; align-items: center; gap: 7px; }
  .colhead .n { background: var(--user-bg); border-radius: 10px; padding: 0 7px; font-size: 11px; color: var(--ink); font-weight: 600; letter-spacing: 0; }
  .colhead .sq { width: 10px; height: 10px; border-radius: 3px; background: var(--repo, var(--accent)); flex: none; }
  .colhead .btn.icon { padding: 3px 7px; }

  /* ---- projects: a folder, or a named set of folders ---- */
  #plist { overflow-y: auto; padding: 6px; min-width: 0; }
  .proj { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 7px; align-items: center; padding: 6px 8px 6px 6px; border-radius: 8px; cursor: pointer; min-width: 0; border-left: 3px solid transparent; position: relative; }
  .proj:hover { background: var(--user-bg); }
  .proj.active { background: var(--user-bg); border-left-color: var(--repo); }
  .proj.all { margin-bottom: 4px; }
  .proj .sq { width: 10px; height: 10px; border-radius: 3px; background: var(--repo); }
  .proj.custom .sq { border-radius: 50%; }
  .proj .pname { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .proj .ptime { font-size: 11px; color: var(--muted); }
  .proj .pills { grid-column: 2 / 4; display: flex; gap: 5px; align-items: center; }
  .proj .pills:empty { display: none; }
  .proj .pfold { grid-column: 2 / 4; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pc { font-size: 10.5px; font-weight: 700; border-radius: 9px; padding: 0 6px; line-height: 16px; color: #fff; }
  .pc.needs { background: var(--needs); } .pc.working { background: var(--working); color: #2a2205; } .pc.ready { background: var(--idle); }
  .proj .pedit { position: absolute; right: 6px; top: 5px; font: inherit; font-size: 12px; line-height: 1; padding: 2px 5px; border: 1px solid transparent; background: var(--panel); color: var(--muted); border-radius: 4px; cursor: pointer; opacity: 0; }
  .proj:hover .pedit { opacity: 1; }
  .proj .pedit:hover { border-color: var(--line); color: var(--ink); }
  .phint { font-size: 11px; color: var(--muted); padding: 10px 10px 6px; line-height: 1.4; }

  /* ---- sessions of the selected project ---- */
  #filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .fchip { font: inherit; font-size: 11px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; flex: none; }
  .fchip .n { font-weight: 600; }
  .fchip:hover { color: var(--ink); }
  .fchip.on { color: var(--ink); border-color: var(--accent); }
  .fchip.needs-input.on { border-color: var(--needs); color: var(--needs); }
  .fchip.needs-input:not(.on) .n:not(:empty) { color: var(--needs); }
  #slist { overflow-y: auto; overflow-x: hidden; min-width: 0; padding: 8px; display: flex; flex-direction: column; gap: 7px; }
  #slist > * { flex: none; } /* never let a full column squash its cards (overflow:hidden items would shrink to 0) */
  #slist .none { color: var(--muted); font-size: 12px; text-align: center; padding: 30px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--repo, var(--line)); border-radius: 10px; padding: 8px 10px 7px; cursor: pointer; min-width: 0; overflow: hidden; }
  .card:hover { border-color: var(--accent); border-left-color: var(--repo, var(--accent)); }
  .card.active { outline: 2px solid var(--accent); outline-offset: -1px; }
  .card.needs-input { border-color: var(--needs); }
  .card.done { opacity: .55; }
  .card .top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .card .repo { font-weight: 800; font-size: 13px; letter-spacing: .1px; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .grow { flex: 1; }
  .card .time { font-size: 11px; color: var(--muted); flex: none; }
  .card .title { margin-top: 4px; font-size: 13.5px; font-weight: 500; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .card .snip { margin-top: 5px; font-size: 12px; line-height: 1.4; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .card .snip.you { -webkit-line-clamp: 2; }
  /* You and Claude are told apart twice over: hue on the glyph (cool teal vs Claude's clay) and
     weight on the text — Claude's line is the one you scan a list for, so it sits brighter and the
     prompt that produced it recedes. */
  .card .snip.claude { color: var(--snip-claude); }
  .card .snip b { font-weight: 600; margin-right: 5px; display: inline; }
  .card .snip.you b { color: var(--you); }
  .card .snip.claude b { color: var(--accent); }
  /* The speaker is a glyph, so it has to sit on the text baseline rather than above it, and it
     must not become a line box of its own when the snippet wraps. */
  .ic { width: 1em; height: 1em; fill: currentColor; vertical-align: -.14em; flex: none; }
  .card .snip .ic { width: 11px; height: 11px; }
  .card .snip.claude .ic { width: 14px; height: 14px; vertical-align: -.24em; }
  /* Only needs-input gets a status line: the dot says stale / working / your turn, this is the one
     state worth a word. Entrypoint, session name and branch live in the chat header. */
  .card .state { font-size: 11px; font-weight: 600; margin-top: 4px; }
  .card .state.needs-input { color: var(--needs); }
  /* Done/reopen: an icon at the end of the top row, not a bordered pill in a row of its own. */
  .act { font: inherit; font-size: 12px; line-height: 1; padding: 0 2px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; flex: none; opacity: .35; }
  .card:hover .act { opacity: .75; }
  .act:hover { opacity: 1; color: var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.working { background: var(--working); animation: pulse 1.4s ease-in-out infinite; }
  .dot.idle { background: var(--idle); }
  .dot.needs-input { background: var(--needs); animation: pulse .8s ease-in-out infinite; }
  .dot.stale, .dot.unknown { background: var(--ended); }
  .dot.done { background: var(--idle); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .badge { background: var(--unread); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 600; min-width: 18px; text-align: center; flex: none; }
  .chip { font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; min-width: 0; flex: 0 1 auto; }

  /* ---- chat pane ---- */
  .shead { padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 6px 9px; align-items: center; flex-wrap: wrap; min-width: 0; min-height: 43px; }
  /* The title takes what is left and truncates. flex-basis must NOT be auto: a long title would then
     exceed the line on its own and push the status, buttons and every chip onto the next one. */
  .shead h2 { margin: 0; font-size: 14px; flex: 1 1 170px; min-width: 0; display: flex; gap: 6px; align-items: center; overflow: hidden; }
  /* The repo is the identifier you navigate by, so it does not shrink — the title absorbs the
     truncation instead, and only past 60% does the repo start to ellipsise too. */
  .shead h2 .repo { font-weight: 800; flex: 0 0 auto; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .shead h2 .repo:hover { text-decoration: underline; text-decoration-style: dotted; }
  .shead h2 .t { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .shead h2 .sep { color: var(--muted); font-weight: 400; flex: none; }
  .shead .path { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .shead .status { font-size: 12px; display: flex; align-items: center; gap: 5px; flex: none; color: var(--muted); }
  .shead a { color: var(--accent); font-size: 12px; }
  /* Path, branch and the session chips fold away behind ··· — what stays in view is the status,
     the PRs and the buttons. display:flex would beat the UA [hidden] rule, hence the override. */
  .shead .details { flex-basis: 100%; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .shead .details[hidden] { display: none; }
  .btn.icon.dots { font-size: 13px; line-height: 1; padding: 3px 7px; letter-spacing: .5px; }
  .btn.icon.dots.on { color: var(--ink); border-color: var(--accent); }
  /* `repo#123` in the state colour, then the PR's title in plain ink once `gh` has answered. The
     title is what makes a chip readable without hovering, so it gets room but not the whole header:
     it ellipsises past its cap, and the chip itself never exceeds one line of the header. */
  .shead .pr { flex: none; max-width: 100%; min-width: 0; display: inline-flex; align-items: baseline; gap: 5px; font-size: 11px; text-decoration: none; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; overflow: hidden; }
  .shead .pr .t { flex: 0 1 auto; min-width: 0; max-width: 320px; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .shead .pr:hover { border-color: currentColor; }
  /* open / merged / closed / draft, in the colours GitHub itself uses. No colour = not looked up
     yet (or `gh` could not tell us), which is why the neutral chip stays the default and the title
     stays as quiet as the rest of the header. No color-mix: the neutral border stands. */
  .shead .pr[data-state="open"] { color: var(--pr-open); border-color: color-mix(in srgb, var(--pr-open) 45%, transparent); }
  .shead .pr[data-state="merged"] { color: var(--pr-merged); border-color: color-mix(in srgb, var(--pr-merged) 45%, transparent); }
  .shead .pr[data-state="closed"] { color: var(--pr-closed); border-color: color-mix(in srgb, var(--pr-closed) 45%, transparent); }
  .shead .pr[data-state="draft"] { color: var(--pr-draft); border-color: color-mix(in srgb, var(--pr-draft) 45%, transparent); }
  #log { overflow-y: auto; padding: 16px 18px 40px; scroll-behavior: smooth; }
  /* ---- composer (stale chats only) ---- */
  #composer { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 10px; display: grid; gap: 6px; }
  #composer[hidden] { display: none; }   /* display:grid above would otherwise beat the UA [hidden] rule */
  #composer textarea { font: inherit; font-size: 13px; resize: vertical; min-height: 44px; max-height: 40vh; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #composer textarea:disabled { opacity: .6; }
  .composer-foot { display: flex; align-items: center; gap: 10px; }
  .composer-foot .hint { font-size: 11px; color: var(--muted); flex: 1; min-width: 0; }
  .composer-foot .hint.err { color: var(--needs); }
  .composer-foot .hint code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #composeSend:disabled { opacity: .5; cursor: default; border-color: var(--line); }
  /* ---- terminal drawer: the real claude, in a PTY on the server ---- */
  #term { border-top: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr; height: 320px; min-height: 120px; max-height: 70vh; min-width: 0; }
  #term[hidden] { display: none; }
  #term .thead { display: flex; align-items: center; gap: 8px; padding: 3px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); cursor: row-resize; user-select: none; }
  #term .thead .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #term .thead .lbl b { color: var(--ink); font-weight: 600; }
  #term .thead code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
  #term .thead button { font: inherit; font-size: 11px; padding: 1px 7px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 5px; cursor: pointer; }
  #term .thead button:hover { border-color: var(--accent); }
  #term .thead button[hidden] { display: none; }
  #term .tbody { min-height: 0; padding: 4px 0 0 6px; background: var(--term-bg); }
  #term .tbody .xterm { height: 100%; }
  /* The chat is prose, so it gets prose spacing: a taller line box than the dense lists beside it
     and a clear gap between turns. Everything below is tuned against that 1.62. */
  .msg { margin: 0 0 18px; }
  .msg.user .bubble { background: var(--user-bg); border-radius: 10px; padding: 11px 15px; border-left: 3px solid var(--accent); }
  .msg.assistant .bubble { padding: 4px 2px; }
  .msg .who { font-size: 11px; color: var(--muted); margin: 0 0 5px 2px; display: flex; gap: 8px; }
  .msg .text { white-space: pre-wrap; word-break: break-word; line-height: 1.62; }
  /* Inline code: a tint and a warm ink, no border. These paragraphs are dense with `code`, and a
     bordered chip per term turns a sentence into a fence of boxes — and, being taller than the words
     around it, it makes every line that contains one taller than the ones that don't. .88em keeps a
     monospace term the same visual size as the prose it sits in. */
  .msg .text code { background: var(--inline-bg); color: var(--code-ink); padding: .12em .34em; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; }
  /* Blocks do keep a border — there the point is to delimit, not to sit inside a sentence. */
  .msg .text pre { background: var(--code-bg); border: 1px solid var(--code-line); padding: 11px 13px; border-radius: 8px;
    overflow-x: auto; font-size: 12.5px; line-height: 1.55; }
  .msg .text pre code { background: none; padding: 0; color: inherit; border-radius: 0; font-size: inherit; }
  .text.md { white-space: normal; }
  .md p { margin: 0 0 11px; } .md > :last-child { margin-bottom: 0; } .md > :first-child { margin-top: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 18px 0 8px; line-height: 1.3; font-weight: 600; }
  .md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14.5px; } .md h4 { font-size: 13.5px; }
  .md ul, .md ol { margin: 8px 0 12px; padding-left: 22px; } .md li { margin: 5px 0; } .md li > p { margin: 0 0 5px; }
  .md li > ul, .md li > ol { margin: 5px 0 0; }
  .md pre { margin: 10px 0 13px; }
  .md table { border-collapse: collapse; margin: 10px 0 13px; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--tool-bg); font-weight: 600; }
  .md blockquote { margin: 10px 0; padding: 3px 13px; border-left: 3px solid var(--line); color: var(--muted); }
  .md a { color: var(--accent); text-decoration: none; } .md a:hover { text-decoration: underline; }
  .md a[href^="vscode:"]::after { content: " ↗"; font-size: 10px; opacity: .6; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .md img { max-width: 100%; }
  .md input[type=checkbox] { margin: 0 6px 0 0; }
  .toolgroup { margin: 2px 0 10px; }
  .toolgroup > summary, .codefold > summary { cursor: pointer; list-style: none; font-size: 11.5px; color: var(--muted); padding: 4px 8px; border-radius: 6px; background: var(--tool-bg); border: 1px solid var(--line); user-select: none; }
  .toolgroup > summary::-webkit-details-marker, .codefold > summary::-webkit-details-marker { display: none; }
  .toolgroup > summary::before, .codefold > summary::before { content: "▸ "; }
  .toolgroup[open] > summary::before, .codefold[open] > summary::before { content: "▾ "; }
  .toolgroup > summary:hover, .codefold > summary:hover { color: var(--ink); border-color: var(--accent); }
  .toolgroup > summary .err { color: var(--needs); }
  .toolgroup[open] > summary { margin-bottom: 4px; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .toolgroup .tool { margin-left: 10px; }
  .codefold { margin: 6px 0 10px; } .codefold > summary { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; } .codefold[open] > summary { margin-bottom: 0; border-radius: 6px 6px 0 0; }
  .codefold[open] > pre { margin-top: 0; border-top: 0; border-radius: 0 0 8px 8px; }   /* one seam, not two borders */
  .tool { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; gap: 8px; padding: 3px 8px; background: var(--tool-bg); border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool b { color: var(--ink); font-weight: 600; }
  .tool.err { color: var(--needs); }
  .sysline { margin: 10px auto; text-align: center; font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; padding: 0 20px; }

  /* ---- project editor ---- */
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 16px 18px; width: min(600px, 92vw); }
  dialog::backdrop { background: rgba(0, 0, 0, .35); }
  dialog h3 { margin: 0 0 10px; font-size: 15px; }
  dialog p.help { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  dialog input[type=text], dialog textarea { font: inherit; font-size: 13px; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
  dialog textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; min-height: 48px; resize: vertical; }
  #pfolders { max-height: 38vh; overflow-y: auto; margin: 8px 0 10px; display: flex; flex-direction: column; gap: 3px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
  #pfolders label { display: flex; gap: 7px; align-items: baseline; font-size: 12.5px; cursor: pointer; min-width: 0; }
  #pfolders label span { color: var(--muted); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #pfolders .none { color: var(--muted); font-size: 12px; }
  .dfoot { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .dfoot .spacer { flex: 1; }
  .dfoot .err { color: var(--needs); font-size: 12px; }
  .dfoot .danger { color: var(--needs); }

  /* ---- syntax highlighting (highlight.js class names, our colours) ---- */
  /* Written out here rather than shipping a hljs theme stylesheet, so the palette follows the
     app's light/dark tokens like everything else. */
  .hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-formula { color: var(--hl-key); }
  .hljs-string, .hljs-regexp, .hljs-symbol, .hljs-bullet, .hljs-addition, .hljs-selector-attr, .hljs-selector-pseudo { color: var(--hl-str); }
  .hljs-number, .hljs-template-variable, .hljs-link, .hljs-operator { color: var(--hl-num); }
  .hljs-title, .hljs-title.function_, .hljs-section, .hljs-name, .hljs-selector-id { color: var(--hl-fn); }
  .hljs-title.class_, .hljs-type, .hljs-built_in, .hljs-class .hljs-title, .hljs-selector-class { color: var(--hl-cls); }
  .hljs-variable, .hljs-attr, .hljs-attribute, .hljs-property, .hljs-params, .hljs-tag, .hljs-deletion { color: var(--hl-var); }
  .hljs-meta, .hljs-meta .hljs-keyword, .hljs-meta .hljs-string, .hljs-subst { color: var(--hl-meta); }
  .hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 600; }
  /* diff blocks read as a diff, not as stripes of text */
  .language-diff .hljs-addition, .language-diff .hljs-deletion { display: inline-block; min-width: 100%; }
  .language-diff .hljs-addition { background: color-mix(in srgb, var(--hl-str) 14%, transparent); }
  .language-diff .hljs-deletion { background: color-mix(in srgb, var(--hl-var) 14%, transparent); }
</style>
</head>
<body>
<header>
  <span id="conn" title="live connection"></span>
  <h1>peix<em>AI</em>rada</h1>
  <span id="counts"></span>
  <span class="spacer"></span>
  <input type="text" id="q" placeholder="filter chats: repo / title / branch…">
  <label title="Also show live panels with no messages, and stale chats older than 30 days"><input type="checkbox" id="showAll"> show empty &amp; &gt;30d</label>
  <select id="toolsMode" title="How tool calls (Bash, Read, Edit…) appear in the chat"><option value="collapsed">tools: collapsed</option><option value="expanded">tools: expanded</option><option value="hidden">tools: hidden</option></select>
  <label title="Fold fenced code blocks longer than 6 lines"><input type="checkbox" id="foldCode"> fold code</label>
  <label><input type="checkbox" id="sound"> sound</label>
  <button id="notifBtn" title="Browser notifications (the server also sends native macOS ones)">🔔 enable browser alerts</button>
  <button id="testBtn" title="Fire a test alert through the server">test alert</button>
</header>
<main id="main">
  <section id="projects">
    <div class="colhead"><span>Projects</span><span class="spacer" style="flex:1"></span><button class="btn icon" id="newProjBtn" title="New project — a name over one or more folders (multi-repo work, an investigation)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M7.25 2h1.5v5.25H14v1.5H8.75V14h-1.5V8.75H2v-1.5h5.25Z"/></svg></button></div>
    <div id="plist"></div>
  </section>
  <section id="sessions">
    <div class="colhead" id="shd"><span id="stitle" class="t"></span><span id="newChat"></span></div>
    <div id="filters"></div>
    <div id="slist"></div>
  </section>
  <div id="splitter" title="Drag to resize"></div>
  <section id="chat">
    <div class="shead" id="shead"><h2>Pick a chat</h2></div>
    <div id="log"><div class="empty">Pick a project on the left, then a chat.</div></div>
    <div id="term" hidden>
      <div class="thead" id="termHead" title="Drag to resize"><span class="lbl" id="termLbl"></span><button id="termKill" title="End this claude process">end</button><button id="termHide" title="Hide the terminal — claude keeps running">hide</button></div>
      <div class="tbody" id="termBody"></div>
    </div>
    <div id="composer" hidden>
      <textarea id="composeText" rows="2" placeholder="Reply here — resumes this chat with `claude --resume`"></textarea>
      <div class="composer-foot">
        <span class="hint" id="composeHint"></span>
        <button class="btn" id="composeSend">Send</button>
      </div>
    </div>
  </section>
</main>
<dialog id="pdlg">
  <h3 id="pdlgTitle">New project</h3>
  <p class="help">A project is a name over one or more folders. Its chats are every chat in those folders; the folders keep their own entries too.</p>
  <input type="text" id="pname" placeholder="Name — e.g. Wallet fees rollout" maxlength="80">
  <div id="pfolders"></div>
  <p class="help">Other folders, one per line (absolute paths):</p>
  <textarea id="pextra" rows="2" placeholder="/Users/you/acme/some-repo"></textarea>
  <div class="dfoot"><button class="btn danger" id="pdel">Delete project</button><span class="err" id="perr"></span><span class="spacer"></span><button class="btn" id="pcancel">Cancel</button><button class="btn" id="psave">Save</button></div>
</dialog>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script src="/vendor/xterm-addon-web-links.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const state = { sessions: new Map(), projects: [], current: null, unread: new Map(), entries: [] };
  const prefs = { project: 'all', filter: 'all', sessionsWidth: 380, sound: false, showAll: false, toolsMode: 'collapsed', foldCode: true, headDetails: false, termOpen: true, termHeight: 320 };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem('peixairada-prefs') || '{}')); } catch {}
  // keys from the lane board (before 2026-09-19): harmless, but no reason to carry them
  for (const k of ['groupByRepo', 'compact', 'chatVisible', 'chatSide', 'chatWidth', 'collapsed', 'repoCollapsed', 'tight', 'showTools']) delete prefs[k];
  const savePrefs = () => { try { localStorage.setItem('peixairada-prefs', JSON.stringify(prefs)); } catch {} };

  // ---- header controls ---------------------------------------------------------------
  $('#sound').checked = prefs.sound; $('#showAll').checked = prefs.showAll; $('#toolsMode').value = prefs.toolsMode; $('#foldCode').checked = prefs.foldCode;
  $('#sound').onchange = e => { prefs.sound = e.target.checked; savePrefs(); if (prefs.sound) beep(); };
  $('#showAll').onchange = e => { prefs.showAll = e.target.checked; savePrefs(); renderBoard(); };
  $('#toolsMode').onchange = e => { prefs.toolsMode = e.target.value; savePrefs(); renderLog(true); };
  $('#foldCode').onchange = e => { prefs.foldCode = e.target.checked; savePrefs(); renderLog(true); };
  $('#q').oninput = renderBoard;
  $('#testBtn').onclick = () => fetch('/api/test-notify', { method: 'POST' });
  $('#notifBtn').onclick = async () => { const p = await Notification.requestPermission(); updateNotifBtn(p); };
  function updateNotifBtn(p = Notification.permission) { $('#notifBtn').textContent = p === 'granted' ? '🔔 browser alerts on' : p === 'denied' ? '🔕 browser alerts blocked' : '🔔 enable browser alerts'; }
  if ('Notification' in window) updateNotifBtn(); else $('#notifBtn').hidden = true;

  // ---- sessions column width ----------------------------------------------------------
  $('#sessions').style.width = prefs.sessionsWidth + 'px';
  {
    const splitter = $('#splitter'); let dragging = false;
    splitter.addEventListener('mousedown', e => { dragging = true; splitter.classList.add('drag'); document.body.style.userSelect = 'none'; e.preventDefault(); });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const r = $('#sessions').getBoundingClientRect();
      prefs.sessionsWidth = Math.round(Math.max(260, Math.min(innerWidth * .6, e.clientX - r.left)));
      $('#sessions').style.width = prefs.sessionsWidth + 'px';
    });
    window.addEventListener('mouseup', () => { if (!dragging) return; dragging = false; splitter.classList.remove('drag'); document.body.style.userSelect = ''; savePrefs(); });
  }

  // ---- helpers -----------------------------------------------------------------------
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rel = ts => { if (!ts) return ''; const d = (Date.now() - new Date(ts)) / 1000; if (d < 60) return `${Math.max(0, d | 0)}s`; if (d < 3600) return `${(d / 60) | 0}m`; if (d < 86400) return `${(d / 3600) | 0}h`; return `${(d / 86400) | 0}d`; };
  // A chat with a PR is titled by it, which is a title the user never wrote and Claude never chose —
  // hover says which PR it is and keeps Claude's own title reachable rather than losing it.
  function titleTip(s) {
    if (!s.prTitle || s.title !== s.prTitle) return '';
    const pr = s.prs?.find(p => p.title === s.prTitle);
    const own = s.aiTitle || s.lastPrompt;
    return `${pr ? pr.label + ' — ' : ''}${s.prTitle}${own ? `\n\nChat: ${own}` : ''}`;
  }
  const statusLabel = { working: 'working…', idle: 'replied — your turn', 'needs-input': 'needs your input', stale: 'stale — write to it to resume', unknown: '' };
  // Inline SVG, not emoji: these sit at ~11px inside muted snippet text, where emoji come with their
  // own colours and weight and stop reading as part of the sentence. `currentColor` keeps them typographic.
  const ICON = {
    you: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 8.2a3.1 3.1 0 1 0 0-6.2 3.1 3.1 0 0 0 0 6.2Zm0 1.4c-3.1 0-5.6 1.7-5.6 3.8V14h11.2v-.6c0-2.1-2.5-3.8-5.6-3.8Z"/></svg>',
    claude: '<svg class="ic burst" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.22 9.10L12.00 0.50L12.78 9.10ZM13.08 9.20L18.76 2.70L14.33 10.11ZM14.52 10.37L22.94 8.45L15.00 11.84ZM15.00 12.16L22.94 15.55L14.52 13.63ZM14.33 13.89L18.76 21.30L13.08 14.80ZM12.78 14.90L12.00 23.50L11.22 14.90ZM10.92 14.80L5.24 21.30L9.67 13.89ZM9.48 13.63L1.06 15.55L9.00 12.16ZM9.00 11.84L1.06 8.45L9.48 10.37ZM9.67 10.11L5.24 2.70L10.92 9.20ZM9.20 12a2.80 2.80 0 1 0 5.60 0a2.80 2.80 0 1 0 -5.60 0Z"/></svg>',
    term: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 3.1 6.4 8l-4.8 4.9 1.1 1.1L8.6 8 2.7 2ZM8 12.6h6.4v1.5H8Z"/></svg>',
    plus: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M7.25 2h1.5v5.25H14v1.5H8.75V14h-1.5V8.75H2v-1.5h5.25Z"/></svg>',
    vscode: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z"/></svg>'
  };
  const entryLabel = s => s.terminal && s.terminal.exited === null ? 'terminal here' : s.live?.entrypoint === 'claude-vscode' ? 'VS Code' : s.live?.entrypoint === 'cli' ? 'CLI' : s.alive ? 'live' : 'stale';
  function repoColor(name) { let h = 0; for (const c of String(name || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} 55% 52%)`; }
  const folderName = cwd => cwd ? cwd.split('/').filter(Boolean).pop() || cwd : '(no folder)';
  const STALE_MAX_AGE_MS = 30 * 86400e3; // Claude Code deletes transcripts after 30 idle days by default; mirror that

  // ---- projects ----------------------------------------------------------------------
  // A project is a folder — the registry cwd, which is the stable repo path — or a name you gave to
  // a set of folders (multi-repo work, an investigation). A chat lives in its folder and in every
  // custom project that claims that folder. "All chats" is the flat list, newest first.
  const ALL = 'all';
  const inFolder = (cwd, f) => !!cwd && (cwd === f || cwd.startsWith(f.replace(/\/$/, '') + '/'));
  const inProject = (s, p) => p.key === ALL || (p.custom ? p.cwds.some(f => inFolder(s.cwd, f)) : (s.cwd || '?') === p.key);
  const projectStub = key => key === ALL ? { key } : key.startsWith('c:') ? { key, custom: true, cwds: state.projects.find(p => 'c:' + p.id === key)?.cwds || [] } : { key };
  // The same rules as the lane board had: empty live panels and stale chats older than 30 days hide unless asked.
  function visible(s) {
    if (prefs.showAll) return true;
    if (s.alive && !s.lastActivity) return false;
    if (!s.alive && !s.done && (!s.lastActivity || Date.now() - new Date(s.lastActivity) > STALE_MAX_AGE_MS)) return false;
    return true;
  }
  // One order everywhere: the chat *you* wrote to most recently first. Claude finishing a long job
  // does not move a card up — what ranks is your last touch (a prompt, an answer to its question, an
  // interrupt), so the chats you are driving stay on top and the parked ones sink by themselves. A
  // session whose tail held no prompt of yours (boot reads only the end of a long transcript) falls
  // back to its last activity, not the bottom.
  const userAt = s => String(s.lastUserAt || s.lastActivity || '');
  const byUser = (a, b) => userAt(b).localeCompare(userAt(a));
  const timeTip = s => !s.lastActivity ? '' : `last activity ${rel(s.lastActivity)} ago${s.lastUserAt ? ` · you last wrote ${rel(s.lastUserAt)} ago` : ''}`;
  const bucket = s => s.done ? 'done' : !s.alive ? 'stale' : s.status === 'needs-input' ? 'needs-input' : s.status === 'working' ? 'working' : 'ready';
  function projectList() {
    const all = { key: ALL, name: 'All chats', cwds: [], sessions: [] };
    const folders = new Map();
    const customs = state.projects.map(p => ({ key: 'c:' + p.id, id: p.id, name: p.name, cwds: p.cwds, custom: true, sessions: [] }));
    for (const s of state.sessions.values()) {
      if (!visible(s)) continue;
      all.sessions.push(s);
      const k = s.cwd || '?';
      if (!folders.has(k)) folders.set(k, { key: k, name: folderName(s.cwd), cwds: s.cwd ? [s.cwd] : [], sessions: [] });
      folders.get(k).sessions.push(s);
      for (const c of customs) if (inProject(s, c)) c.sessions.push(s);
    }
    const stat = p => {
      const live = p.sessions.filter(s => !s.done && s.alive);
      p.needs = live.filter(s => s.status === 'needs-input').length;
      p.working = live.filter(s => s.status === 'working').length;
      p.ready = live.filter(s => s.status === 'idle').length;
      p.unread = p.sessions.reduce((n, s) => n + (state.unread.get(s.id) || 0), 0);
      p.last = p.sessions.reduce((m, s) => userAt(s) > m ? userAt(s) : m, '');
      return p;
    };
    return [stat(all), ...customs.map(stat), ...[...folders.values()].map(stat).sort((a, b) => b.last.localeCompare(a.last))];
  }
  function projHtml(p) {
    const color = p.key === ALL ? 'var(--accent)' : repoColor(p.name);
    const pills = `${p.needs ? `<span class="pc needs" title="needs your input">${p.needs}</span>` : ''}${p.working ? `<span class="pc working" title="Claude working">${p.working}</span>` : ''}${p.ready ? `<span class="pc ready" title="replied — your turn">${p.ready}</span>` : ''}${p.unread ? `<span class="badge">${p.unread}</span>` : ''}`;
    return `<div class="proj ${p.key === prefs.project ? 'active' : ''} ${p.custom ? 'custom' : ''} ${p.key === ALL ? 'all' : ''}" data-key="${esc(p.key)}" style="--repo:${color}" title="${esc(p.custom ? (p.cwds.join('\n') || 'no folders yet') : p.key === ALL ? 'Every chat, newest first' : p.key)}">
      <span class="sq"></span><span class="pname">${esc(p.name)}</span><span class="ptime">${p.last ? rel(p.last) : ''}</span>
      <span class="pills">${pills}</span>
      ${p.custom ? `<span class="pfold">${esc(p.cwds.length ? p.cwds.map(folderName).join(' · ') : 'no folders')}</span><button class="pedit" title="Edit this project">✎</button>` : ''}
    </div>`;
  }

  // ---- render: both lists ------------------------------------------------------------
  const FILTERS = [['all', 'all'], ['needs-input', 'needs you'], ['working', 'working'], ['ready', 'ready'], ['stale', 'stale'], ['done', 'done']];
  function renderBoard() {
    const ps = projectList();
    if (!ps.some(p => p.key === prefs.project)) prefs.project = ALL;
    const cur = ps.find(p => p.key === prefs.project);
    $('#plist').innerHTML = ps.map(projHtml).join('') + (ps.length === 1 ? '<div class="phint">Folders show up here as soon as a chat runs in them. <b>+</b> names a project over several.</div>' : '');
    renderSessionList(cur);
    const all = ps[0];
    $('#counts').textContent = `${[...state.sessions.values()].filter(s => s.alive).length} live · ${all.ready} ready · ${all.working} working${all.needs ? ` · ${all.needs} need you` : ''}`;
    const total = [...state.unread.values()].reduce((a, b) => a + b, 0);
    document.title = (total ? `(${total}) ` : '') + 'peixAIrada';
  }
  function knownFolders() { return [...new Set([...state.sessions.values()].map(s => s.cwd).filter(Boolean))].sort(); }
  function renderSessionList(p) {
    const q = $('#q').value.trim().toLowerCase();
    const list = p.sessions.filter(s => !q || `${s.project} ${s.title} ${s.aiTitle || ''} ${s.lastPrompt} ${s.live?.name || ''} ${s.gitBranch || ''}`.toLowerCase().includes(q));
    const counts = { all: list.length };
    for (const s of list) counts[bucket(s)] = (counts[bucket(s)] || 0) + 1;
    if (!FILTERS.some(f => f[0] === prefs.filter)) prefs.filter = 'all';
    // done chats sink under everything else; inside each half it is your last touch, newest first
    const shown = (prefs.filter === 'all' ? list : list.filter(s => bucket(s) === prefs.filter)).sort((a, b) => (Number(!!a.done) - Number(!!b.done)) || byUser(a, b));
    $('#stitle').innerHTML = `<span class="sq" style="--repo:${p.key === ALL ? 'var(--accent)' : repoColor(p.name)}"></span><span class="t">${esc(p.name)}</span><span class="n">${list.length}</span>`;
    $('#stitle').title = p.custom ? p.cwds.join('\n') : p.key === ALL ? '' : p.key;
    // new chat: one folder is a button; several (a custom project, All) is a pick-list of folders
    const folders = p.key === ALL ? knownFolders() : p.cwds;
    $('#newChat').innerHTML = folders.length === 1 ? `<button class="btn icon" id="newChatBtn" data-cwd="${esc(folders[0])}" title="New chat in ${esc(folderName(folders[0]))} — opens a terminal running claude there">${ICON.plus}<span class="lbl">new chat</span></button>`
      : folders.length ? `<select id="newChatSel" title="New chat in a folder — opens a terminal running claude there"><option value="">＋ new chat in…</option>${folders.map(f => `<option value="${esc(f)}">${esc(folderName(f))}</option>`).join('')}</select>` : '';
    $('#filters').innerHTML = FILTERS.map(([k, label]) => `<button class="fchip ${k} ${prefs.filter === k ? 'on' : ''}" data-f="${k}">${label}<span class="n">${counts[k] || ''}</span></button>`).join('');
    $('#slist').innerHTML = shown.map(s => cardHtml(s, p)).join('') || `<div class="none">${q ? 'Nothing matches' : prefs.filter !== 'all' ? 'Nothing here' : 'No chats yet — start one with + above'}</div>`;
  }
  function cardHtml(s, p) {
    const un = state.unread.get(s.id) || 0;
    const showReply = s.lastReply && s.status !== 'working';
    const act = s.done ? `<button class="act" data-act="reopen" title="Untick — bring it back">↩</button>`
      : (!s.alive || s.status === 'idle') && s.lastActivity ? `<button class="act" data-act="done" title="Tick as done (persisted; comes back on new activity)">✓</button>` : '';
    const tip = titleTip(s);
    const showRepo = p.key === ALL || p.custom;
    return `<div class="card ${s.status} ${s.done ? 'done' : ''} ${s.id === state.current ? 'active' : ''}" data-id="${s.id}" style="--repo:${repoColor(s.project)}">

  // ---- terminal drawer: the real claude in a PTY on the server, attached over a WebSocket -----
  // The drawer belongs to the chat pane: it shows the terminal of the session being viewed, or the
  // one a new chat is being started in. The process lives on the server, so hiding the drawer or
  // switching chats does not end it — "end" does. The server replays its scrollback on every attach,
  // which is what makes a reload or a switch-and-back seamless. The transcript above it is the
  // reading view; the terminal is where you type.
  const term = { id: null, sessionId: null, cwd: null, resume: false, ws: null, xt: null, fit: null, exited: null, err: null };
  function xtTheme() {
    const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
    return { background: v('--term-bg'), foreground: v('--ink'), cursor: v('--accent'), cursorAccent: v('--term-bg'), selectionBackground: v('--term-sel') };

  function ensureXterm() {
    if (term.xt) return;

  }

  function showTermDrawer(on) {

  function attachTerm(t) {

  }
  function detachTerm() {
    const ws = term.ws; term.ws = null;

    Object.assign(term, { id: null, sessionId: null, cwd: null, resume: false, exited: null });
  }

  async function killTerm() { if (term.id) await fetch(`/api/terminals/${term.id}`, { method: 'DELETE' }); }
  function renderTermHead() {

    $('#termLbl').innerHTML = `<code>claude${term.resume ? ' --resume' : ''}</code> · ${esc(term.cwd || '')}${what ? ` · <b>${what}</b>` : ''}`;
    $('#termKill').hidden = term.exited !== null;
  }

  // ---- composer: reply into a stale chat -----------------------------------------------
  // Stale only. The server refuses a live chat (resuming it would put a second writer on its
  // transcript), so the box hides rather than offering something guaranteed to 409. Never touches
  // the textarea's value — this re-runs on every SSE update, and you may be mid-sentence.
  function renderComposer(s) {
    const box = $('#composer'), ta = $('#composeText'), btn = $('#composeSend'), hint = $('#composeHint');
    // …and not under a terminal on the same chat: that is the reply box now, and a `-p` reply racing it
    // would be the second writer the server refuses anyway once claude has registered.
    if (!s || s.alive || !s.file || termLive(s) || (term.id && term.sessionId === s.id && term.exited === null)) { box.hidden = true; return; }
    box.hidden = false;
    const busy = !!s.replying;
    ta.disabled = busy;
    btn.disabled = busy || !ta.value.trim();
    btn.textContent = busy ? 'Sending…' : 'Send';
    if (busy) { hint.className = 'hint'; hint.textContent = `resuming — ${s.replying.snippet}`; }
    else if (s.replyError) { hint.className = 'hint err'; hint.textContent = s.replyError; }
    else { hint.className = 'hint'; hint.innerHTML = 'One-shot reply with <code>claude --resume -p</code> · ⏎ send, ⇧⏎ newline · or open the terminal above'; }
  }
  async function sendReply() {
    const id = state.current, ta = $('#composeText'), hint = $('#composeHint'), text = ta.value.trim();
    if (!id || !text) return;
    $('#composeSend').disabled = true;
    try {
      const r = await fetch(`/api/sessions/${id}/reply`, {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { hint.className = 'hint err'; hint.textContent = d.error || `failed (${r.status})`; $('#composeSend').disabled = false; return; }

  $('#composeText').addEventListener('input', () => {

  });

  // ---- transcript rendering ----------------------------------------------------------
  // Fallback renderer (fenced code, inline code, bold) if the vendored libs failed to load.
  function mdFallback(t) {
    const parts = String(t).split(/```/);
    return parts.map((p, i) => i % 2 ? `<pre><code>${esc(p.replace(/^\w*\n/, ''))}</code></pre>`
      : esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')).join('');
  }
  const hasMd = typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined';
  if (hasMd) marked.setOptions({ gfm: true, breaks: true });
  // Syntax highlighting. Optional like the other vendored libs — without it code blocks just stay
  // plain. hljs escapes everything it emits, so its output can go in after DOMPurify has run.
  const hasHl = typeof hljs !== 'undefined';
  // Unlabelled fences are as often terminal output as code, and auto-detect on those guesses badly
  // (~4x the cost of a known language, and a whole log re-renders on every SSE update). So: guess
  // only for short blocks, and only among the languages that actually turn up here.
  const AUTO_LANGS = ['bash', 'javascript', 'typescript', 'python', 'json', 'yaml', 'go', 'sql', 'diff', 'xml', 'css'];
  const AUTO_MAX = 2000;
  function highlight(root) {
    if (!hasHl) return;
    for (const code of root.querySelectorAll('pre > code')) {
      const src = code.textContent;
      if (!src.trim()) continue;
      const lang = (code.className.match(/language-([\w+#.-]+)/) || [])[1];
      try {
        const r = lang && hljs.getLanguage(lang) ? hljs.highlight(src, { language: lang, ignoreIllegals: true })
          : !lang && src.length < AUTO_MAX ? hljs.highlightAuto(src, AUTO_LANGS)
          : null;
        if (!r) continue;
        code.innerHTML = r.value;
        if (!lang && r.language) code.classList.add(`language-${r.language}`);
      } catch {}
    }
  }
  const ABS_URL = /^([a-z][a-z0-9+.-]*:|\/\/|#)/i;
  // Full GFM via marked, sanitised by DOMPurify (replies may contain raw HTML). Relative links —
  // Claude writes [file.ts:42](src/file.ts#L42) — are resolved against the session cwd and opened in VS Code.
  function md(t, cwd) {
    if (!hasMd) return { html: mdFallback(t), cls: '' };
    let html;
    try { html = DOMPurify.sanitize(marked.parse(String(t ?? ''))); } catch { return { html: mdFallback(t), cls: '' }; }
    const tpl = document.createElement('template'); tpl.innerHTML = html;
    highlight(tpl.content);
    for (const a of tpl.content.querySelectorAll('a[href]')) {
      const href = a.getAttribute('href') || '';
      if (ABS_URL.test(href)) { a.target = '_blank'; a.rel = 'noopener'; continue; }
      const m = href.match(/^([^#?]+)(?:#L(\d+))?/);
      if (!m) continue;
      const abs = m[1].startsWith('/') ? m[1] : `${cwd || ''}/${m[1].replace(/^\.\//, '')}`;
      a.setAttribute('href', `vscode://file${abs}${m[2] ? ':' + m[2] : ''}`);
      a.title = `Open ${abs}${m[2] ? ':' + m[2] : ''} in VS Code`;
    }
    if (prefs.foldCode) for (const pre of tpl.content.querySelectorAll('pre')) {
      const code = pre.querySelector('code');
      const lines = (code?.textContent || pre.textContent).replace(/\n$/, '').split('\n').length;
      if (lines <= 6) continue;
      const lang = (code?.className.match(/language-([\w+-]+)/) || [])[1] || 'code';
      const d = document.createElement('details'); d.className = 'codefold';
      const sm = document.createElement('summary'); sm.textContent = `${lang} · ${lines} lines`;
      pre.replaceWith(d); d.append(sm, pre);
    }
    return { html: tpl.innerHTML, cls: 'md' };
  }
  function entryHtml(e) {
    if (e.kind === 'text') {
      const r = md(e.text, state.sessions.get(state.current)?.cwd);
      return `<div class="msg ${e.role}"><div class="who"><span>${e.role === 'user' ? 'You' : 'Claude'}</span><span>${e.ts ? new Date(e.ts).toLocaleTimeString() : ''}</span></div><div class="bubble"><div class="text ${r.cls}">${r.html}</div></div></div>`;
    }
    if (e.kind === 'tool_use') return `<div class="tool"><b>${esc(e.name)}</b><span>${esc(e.text)}</span></div>`;
    if (e.kind === 'tool_result') return `<div class="tool ${e.isError ? 'err' : ''}"><span>↳</span><span>${esc(e.text || '(no output)')}</span></div>`;
    if (e.kind === 'interrupt' || e.kind === 'compact') return `<div class="sysline">${esc(e.text)}</div>`;
    return '';
  }
  function toolGroupHtml(run) {
    const uses = run.filter(e => e.kind === 'tool_use');
    const errs = run.filter(e => e.kind === 'tool_result' && e.isError).length;
    const byName = {}; for (const u of uses) byName[u.name] = (byName[u.name] || 0) + 1;
    const label = Object.entries(byName).sort((a, b) => b[1] - a[1]).map(([n, c]) => c > 1 ? `${n} ×${c}` : n).join(', ');
    return `<details class="toolgroup"${prefs.toolsMode === 'expanded' ? ' open' : ''}><summary>${uses.length} tool call${uses.length === 1 ? '' : 's'} · ${esc(label)}${errs ? ` · <span class="err">${errs} error${errs > 1 ? 's' : ''}</span>` : ''}</summary>${run.map(entryHtml).join('')}</details>`;
  }
  function renderLog(reset = false) {
    const log = $('#log');
    const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    // keep groups the reader opened/closed by hand across live re-renders
    const opened = reset ? null : [...log.querySelectorAll('details.toolgroup')].map(d => d.open);
    const out = []; let run = [];
    const flush = () => { if (run.length && prefs.toolsMode !== 'hidden') out.push(toolGroupHtml(run)); run = []; };
    for (const e of state.entries) {
      if (e.kind === 'tool_use' || e.kind === 'tool_result') { run.push(e); continue; }
      flush(); out.push(entryHtml(e));
    }
    flush();
    log.innerHTML = out.join('') || '<div class="empty">No messages yet</div>';
    if (opened) log.querySelectorAll('details.toolgroup').forEach((d, i) => { if (i < opened.length) d.open = opened[i]; });
    if (stick) log.scrollTop = log.scrollHeight;
  }

  async function openSession(id) {
    state.current = id; state.unread.delete(id);
    const s0 = state.sessions.get(id);
    // a deep link or a notification can point at a chat outside the selected project — switch to its folder
    if (s0 && !inProject(s0, projectStub(prefs.project))) { prefs.project = s0.cwd || '?'; savePrefs(); }
    renderBoard();
    if (s0) renderHead(s0);
    const r = await fetch(`/api/sessions/${id}/messages`); if (!r.ok) return;
    const data = await r.json();
    state.sessions.set(id, data.session); state.entries = data.entries; renderHead(data.session); renderLog(); syncTerm(data.session);
    $('#log').scrollTop = $('#log').scrollHeight;
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
    document.querySelector(`#slist .card[data-id="${id}"]`)?.scrollIntoView({ block: 'nearest' });
  }

  // ---- alerts --------------------------------------------------------------------------
  let audio;
  function beep() {
    try {
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.connect(g); g.connect(audio.destination); o.frequency.value = 880; g.gain.value = .06;
      o.start(); o.frequency.setValueAtTime(1175, audio.currentTime + .09); o.stop(audio.currentTime + .18);
    } catch {}
  }
  // No in-page toast: alerts surface as the unread badge on the card and its project plus a *system*
  // notification (the Mac app posts its own; a plain browser gets the Notification API one below).
  function onAlert(a) {
    const viewing = a.sessionId && a.sessionId === state.current && document.visibilityState === 'visible' && document.hasFocus();
    if (a.sessionId && !viewing) state.unread.set(a.sessionId, (state.unread.get(a.sessionId) || 0) + 1);
    renderBoard(); if (prefs.sound) beep();
    if ('Notification' in window && Notification.permission === 'granted' && !viewing) {
      const n = new Notification(`${a.kind === 'reply' ? 'Claude replied' : 'Claude needs input'} · ${a.project}`, { body: `${a.title}\n${a.snippet || ''}`, tag: a.sessionId || 'test' });
      n.onclick = () => { window.focus(); if (a.sessionId) openSession(a.sessionId); n.close(); };
    }
  }

  // ---- SSE ----------------------------------------------------------------------------
  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => $('#conn').classList.add('on');
    es.onerror = () => { $('#conn').classList.remove('on'); };
    es.addEventListener('snapshot', e => {
      const d = JSON.parse(e.data);
      state.sessions = new Map(d.sessions.map(s => [s.id, s])); state.projects = d.projects || [];
      renderBoard();
      const want = location.hash.slice(1);
      if (want && !state.current && state.sessions.has(want)) openSession(want);
    });
    es.addEventListener('session', e => { const s = JSON.parse(e.data); state.sessions.set(s.id, s); renderBoard(); if (s.id === state.current) { renderHead(s); syncTerm(s); } });
    es.addEventListener('entries', e => { const d = JSON.parse(e.data); if (d.sessionId === state.current) { state.entries.push(...d.entries); renderLog(); } });
    es.addEventListener('projects', e => { state.projects = JSON.parse(e.data).projects || []; renderBoard(); });
    es.addEventListener('terminal', e => {
      const t = JSON.parse(e.data);
      if (t.id !== term.id) return;
      if (t.sessionId && !term.sessionId) { term.sessionId = t.sessionId; openSession(t.sessionId); }
      if (t.exited !== null && term.exited === null) { term.exited = t.exited; renderTermHead(); }
    });
    es.addEventListener('alert', e => onAlert(JSON.parse(e.data)));
  }
  connect();
  setInterval(renderBoard, 30_000); // refresh relative times
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.current) { state.unread.delete(state.current); renderBoard(); } });
  // deep link: /#<session-id> opens that chat — also how the native app's notifications jump here
  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (id && id !== state.current && state.sessions.has(id)) openSession(id);
  });
})();
</script>
</body>
</html>
